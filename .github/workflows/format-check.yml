name: "Code Formatting Check"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  format:
    name: Prettier Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Prettier Check
      run: npm run format:check