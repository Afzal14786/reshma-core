name: "CodeQL Advanced Security"

on:
  # 1. Run the scan whenever code is pushed directly to the main branch
  push:
    branches: [ "main" ]
  # 2. Run the scan on every Pull Request targeting the main branch
  pull_request:
    branches: [ "main" ]
  # 3. Run a deep scan once a week (Sunday at 1:30 AM) just to be safe
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Note: CodeQL groups both JavaScript and TypeScript under 'javascript'
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL Engine
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # We use the 'extended' query suite for maximum security checks
        queries: security-extended,security-and-quality

    - name: Autobuild codebase
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"