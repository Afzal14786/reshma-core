# ──────────────────────────────────────────────
# Reshma-Core Test Redis Configuration
# Isolated, password-protected, no persistence
# ──────────────────────────────────────────────

port 6379
bind 0.0.0.0
requirepass testredispassword

# Disable persistence — test data is ephemeral
save ""
appendonly no

# Memory management
maxmemory 128mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice